name: Deploy console to Cloudflare Pages

# The console is a static build, so deploying it is: build, upload. The engine is
# NOT deployed here — it needs a real disk (Cloudflare Containers have ephemeral
# storage and a 20 GB ceiling), so it runs wherever it has a volume and this
# build is pointed at it via VITE_API_BASE_URL.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Engine URL to bake into the build (blank = same origin)'
        required: false
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # The integration test drives the *real* engine binary over HTTP, so the
      # binary has to exist before the tests run. Without this the suite fails
      # with "server binary not found" — which is exactly what happened until
      # this step was added.
      - name: Build the engine
        working-directory: media-ingest-c
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
          make

      - name: Verify (typecheck, lint, tests)
        working-directory: web
        run: |
          npx tsc --noEmit
          npx eslint .
          npx vitest run

      - name: Build
        working-directory: web
        env:
          # The engine URL, in priority order:
          #   1. a manual run's `api_base_url` input;
          #   2. the repository variable, so an operator can point it elsewhere
          #      without editing this file;
          #   3. the URL this project's engine actually runs at, as a default.
          #
          # The default matters: with a bare `vars.VITE_API_BASE_URL` and no
          # variable set, the value is empty and the console silently targets its
          # own origin — a working-looking deploy that cannot reach an engine.
          VITE_API_BASE_URL: ${{ inputs.api_base_url || vars.VITE_API_BASE_URL || 'https://work-2-udmvulmbrekbbouh.prod-runtime.all-hands.dev' }}
        run: npm run build

      # Run wrangler directly rather than through cloudflare/wrangler-action.
      # The action invokes `npx wrangler@latest`, and npm 11 refuses to install
      # a package it does not have without confirmation, so the action fails in
      # CI with "npx canceled due to missing packages and no YES option". A
      # pinned `npx --yes wrangler@<version>` is the same command that works
      # locally, with the version the repo is tested against.
      - name: Publish
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3.90.0 pages deploy dist --project-name=vyzorix-file-downloader --branch=main
