name: Deploy console to Cloudflare Pages

# The console is a static build, so deploying it is: build, upload. The engine is
# NOT deployed here — it needs a real disk (Cloudflare Containers have ephemeral
# storage and a 20 GB ceiling), so it runs wherever it has a volume and this
# build is pointed at it via VITE_API_BASE_URL.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Engine URL to bake into the build (blank = same origin)'
        required: false
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # The integration test drives the *real* engine binary over HTTP, so the
      # binary has to exist before the tests run. Without this the suite fails
      # with "server binary not found" — which is exactly what happened until
      # this step was added.
      - name: Build the engine
        working-directory: media-ingest-c
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
          make

      - name: Verify (typecheck, lint, tests)
        working-directory: web
        run: |
          npx tsc --noEmit
          npx eslint .
          npx vitest run

      - name: Build
        working-directory: web
        env:
          # Repository variable, so the engine URL is not hardcoded in the repo.
          # Blank is valid: the console then targets its own origin, which is what
          # a reverse proxy in front of both the console and the engine provides.
          VITE_API_BASE_URL: ${{ inputs.api_base_url || vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name=vyzorix-file-downloader --branch=main
