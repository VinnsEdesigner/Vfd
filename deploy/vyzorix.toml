# deploy/vyzorix.toml — the Vyzorix deploy manifest for Vfd (TEMPLATE).
#
# THIS IS A TEMPLATE. The device id, the org and the three artifact digests are
# filled in from the actual build; run `deploy/manifest.sh` to render the file
# that is deployed:
#
#   ./deploy/build.sh                 # build the artifacts + SHA256SUMS
#   ./deploy/manifest.sh \
#       --device d_01H... --org org_01H... \
#       --base-url https://<public-host>/vfd/<version>
#   # -> deploy/dist/vyzorix.toml
#
# WHY IT IS RENDERED, NOT HAND-WRITTEN
#
# Every `sha256` must be the digest of the exact tarball that was published. A
# digest typed by hand drifts from the artifact the moment either changes, and
# the device refuses a mismatch — so the digests come from `deploy/dist/SHA256SUMS`
# and nothing else. The base URL is a flag because a private repo's release assets
# need authentication and a device cannot provide it: the artifacts must be served
# from a public host (a public bucket, or a public repo's release).
#
# The manifest is the only file a human authors for a deploy. Read
# VYZORIX/DOCUMENTATION/MANIFEST_REFERENCE.md for every field.

[device]
id   = "__DEVICE_ID__"
org  = "__ORG__"
name = "vfd"                       # display-name override

[[app]]
name      = "vfd"
cmd       = "/home/apps/vfd/engine/run.sh"
port      = 8787
autostart = true
expose    = "loopback"             # reachable from the device itself
purge     = false

# Sub-tables and bare keys must precede the first [[app.artifact]]: inside an
# array-of-tables element a bare key belongs to that element, so a `pwa` written
# after an artifact would set the *artifact's* field and be refused.

# Configuration only — safe to commit, travels in the signed config. No secrets:
# the engine holds none, and the compiler refuses a secret-shaped value here.
[app.env]
MI_HOST          = "127.0.0.1"
MI_PORT          = "8787"
MI_ALLOW_ORIGINS = "*"
MI_RENDER        = "0"             # no Chromium on a phone; rendering off
MI_INTERACTIVE   = "0"

# The console becomes an installable web app. The device writes site.webmanifest
# into the webroot before the app starts; the engine serves it as a static file.
[app.pwa]
name       = "Vfd"
short_name = "Vfd"
theme_color = "#be123c"

  # The engine for THIS device's ABI. One manifest targets one device, and a
  # device has one ABI, so exactly one engine artifact is listed — see
  # deploy/README.md, and the note below on why listing several is a trap.
  [[app.artifact]]
  name   = "engine"
  arch   = "__ARCH__"
  url    = "__BASE_URL__/vfd-engine-__ARTIFACT__.tar.gz"
  sha256 = "__SHA_ENGINE__"

  # The console. `kind = "webroot"` makes the device unpack it under
  # <app>/console/www and (with `pwa`) generate the manifest there.
  [[app.artifact]]
  name   = "console"
  url    = "__BASE_URL__/vfd-console.tar.gz"
  sha256 = "__SHA_CONSOLE__"
  kind   = "webroot"

  # The extractors: ffmpeg, ffprobe, aria2c, yt-dlp, gallery-dl, py1337x, with
  # the libraries and Python modules they need. Architecture-specific, like the
  # engine, so it carries this device's ABI too.
  #
  # They are optional: a device without this artifact still downloads a direct
  # URL or an HLS manifest, and the engine reports the capability it has rather
  # than failing. With them, video sites and torrents resolve.
  [[app.artifact]]
  name   = "extractors"
  arch   = "__ARCH__"
  url    = "__BASE_URL__/vfd-extractors-__ARTIFACT__.tar.gz"
  sha256 = "__SHA_EXTRACTORS__"
