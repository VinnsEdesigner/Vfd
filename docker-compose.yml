# Run vyzor locally, with a browser it can render with.
#
#   docker compose up --build
#
# The console is a static build. Serve it from vyzor's own webroot (mount
# web/dist and set MI_WEBROOT) so the page and the API share one origin — or run
# `./scripts/server.sh` on the host, which does exactly that. There is no CDN
# deploy: the console ships beside the engine, locally and on a device.
#
# WHY THE LIMITS ARE SET EXPLICITLY
#
# A render runs a real browser and peaks around 500 MB of proportional set size
# (measured). The memory limit below is the smallest that comfortably holds one
# render plus vyzor; the render concurrency is one for the same reason. A
# 512 MB instance cannot run this — it will be killed mid-render.
services:
  vyzor:
    build: ./media-ingest-c
    image: vyzor:local
    # The port the console should be pointed at.
    ports:
      - "8787:8787"
    volumes:
      # Downloads, rendered-page cache and browser profiles. Named, so they
      # survive `docker compose down`; the operator chooses the real size.
      - vyzor-data:/data
      # The console build, served from vyzor at `/`. Build it first with
      # `cd web && npm run build`, then uncomment both this mount and MI_WEBROOT
      # below to serve the console same-origin.
      # - ./web/dist:/webroot:ro
    environment:
      # Uncomment with the /webroot mount above to serve the console from
      # vyzor's own origin — then no CORS is involved and MI_ALLOW_ORIGINS can
      # stay narrow. With MI_WEBROOT unset, vyzor is a pure API and this must
      # name wherever the console is served.
      # MI_WEBROOT: "/webroot"
      MI_ALLOW_ORIGINS: "http://localhost:5173"
      # Some sites refuse a request that does not look like a browser.
      MI_USER_AGENT: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
      # Rendering is on, and one at a time: each costs about 500 MB.
      MI_RENDER: "1"
      # Live pages are on, also one at a time. A live session is a whole browser
      # held open, so it is a separate opt-in from rendering and shares the same
      # memory reasoning.
      MI_INTERACTIVE: "1"
      # Live video is on too. It is the heaviest of the three: a session holds
      # an Xvfb and a Chromium, and the frames are encoded. It needs the
      # GStreamer webrtc plugins, which the image carries.
      MI_RTC: "1"
    # The image's CMD already supplies serve, the host, the port, --render and
    # --interactive; these only add what cannot be a compiled-in default. The
    # vyzor reads them from the environment, which is how a container is
    # configured.
    command:
      - serve
      - --render-concurrent=1
      - --interactive-concurrent=1
      - --rtc-concurrent=1
      # STUN so a viewer on another network can connect; vyzor's host
      # candidates alone only work on the same LAN.
      - --rtc-stun=stun://stun.l.google.com:19302
    deploy:
      resources:
        limits:
          # The floor for one render plus vyzor. Raise it only alongside
          # --render-concurrent: two renders need roughly twice this.
          # A render plus vyzor, with headroom for one live-video session
          # (an Xvfb, a Chromium and the encoder).
          memory: 3g
    # A browser needs more than the 64 MB a container gets by default for
    # /dev/shm. vyzor passes --disable-dev-shm-usage as well, so this is a
    # second allowance rather than the only one.
    shm_size: "512m"
    restart: unless-stopped

volumes:
  vyzor-data:
