<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Media Ingest — Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <!-- ===================== SIDEBAR ===================== -->
      <aside class="sidebar">
        <div class="sidebar__top">
          <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="2" y="2" width="20" height="20" rx="5" fill="currentColor" opacity="0.1" />
              <path d="M8 16V8l8 8V8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span>Ingest</span>
          </div>

          <nav class="nav" aria-label="Main">
            <button class="nav__item is-active" data-view="overview">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3h6v6H3zM11 3h6v4h-6zM11 9h6v8h-6zM3 11h6v6H3z" fill="currentColor" opacity=".9"/></svg>
              Overview
            </button>
            <button class="nav__item" data-view="downloads">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              Downloads
              <span class="nav__count" id="navCount">4</span>
            </button>
            <button class="nav__item" data-view="ingest">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              New ingest
            </button>
            <button class="nav__item" data-view="storage">
              <svg viewBox="0 0 20 20" aria-hidden="true"><ellipse cx="10" cy="5" rx="6" ry="2.4" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M4 5v10c0 1.3 2.7 2.4 6 2.4s6-1.1 6-2.4V5" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M4 10c0 1.3 2.7 2.4 6 2.4s6-1.1 6-2.4" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
              Storage
            </button>
            <button class="nav__item" data-view="settings">
              <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M10 2.6v2.2M10 15.2v2.2M17.4 10h-2.2M4.8 10H2.6M15.2 4.8l-1.6 1.6M6.4 13.6l-1.6 1.6M15.2 15.2l-1.6-1.6M6.4 6.4L4.8 4.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              Settings
            </button>
          </nav>
        </div>

        <div class="sidebar__bottom">
          <div class="status">
            <span class="status__dot" id="connDot"></span>
            <div class="status__text">
              <span class="status__label">Connected</span>
              <code class="status__url" id="connUrl">127.0.0.1:8787</code>
            </div>
          </div>
        </div>
      </aside>

      <!-- ===================== MAIN ===================== -->
      <div class="main">
        <header class="topbar">
          <div class="topbar__left">
            <h1 id="viewTitle">Overview</h1>
            <p id="viewSubtitle">Pipeline health and recent activity</p>
          </div>
          <div class="topbar__right">
            <button class="btn btn--icon" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5v2M10 15.5v2M17.5 10h-2M4.5 10h-2M15.3 4.7l-1.4 1.4M6.1 13.9l-1.4 1.4M15.3 15.3l-1.4-1.4M6.1 6.1L4.7 4.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="10" r="3.2" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
            </button>
            <button class="btn" id="refreshBtn">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-1.9-4.6M16.5 3v3.5H13" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Refresh
            </button>
            <button class="btn btn--primary" id="newJobBtn">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4.5v11M4.5 10h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              New ingest
            </button>
          </div>
        </header>

        <div class="content" id="content"><!-- views render here --></div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
